domain: botcore
version: '1.0'
metadata:
  created: '2026-02-04'
  description: Portable AI agent core with memory, identity, skills, and task management
nodes:
  feat-memory:
    type: Feature
    layer: domain
    status: active
    priority: core
    name: Memory System
    description: >-
      Engram (cognitive dynamics) + file-based logs. Hybrid memory with ACT-R activation, Hebbian learning, and
      consolidation.
    tasks:
      - '[x] Design Memory class API'
      - '[x] Integrate Engram MCP/Python client'
      - '[x] Implement file-based log sync'
      - '[x] Add export/import for memory.db'
      - '[x] Write tests for recall/store'
  feat-identity:
    type: Feature
    layer: domain
    status: active
    priority: core
    name: Identity Management
    description: Load/save SOUL.md, IDENTITY.md, USER.md. Parse and validate identity files.
    tasks:
      - '[x] Design Identity class API'
      - '[x] Implement Markdown parser for SOUL/IDENTITY/USER'
      - '[x] Validate identity schema'
      - '[x] Add identity export/import'
      - '[x] Write tests'
  feat-skills:
    type: Feature
    layer: domain
    status: draft
    priority: supporting
    name: Skills Registry
    description: Skill loader, registry, and metadata management. Support MCP, native, and HTTP skills.
    tasks:
      - '[ ] Design Skills class API'
      - '[ ] Implement skill discovery (SKILL.md)'
      - '[ ] Skill loader (MCP/native/HTTP)'
      - '[ ] Skill metadata validation'
      - '[ ] Write tests'
  feat-config:
    type: Feature
    layer: domain
    status: draft
    priority: supporting
    name: Configuration Management
    description: Model preferences, permissions, platform hints. Schema validation.
    tasks:
      - '[ ] Design Config class API'
      - '[ ] Define JSON schema'
      - '[ ] Implement load/save/validate'
      - '[ ] Add config export/import'
      - '[ ] Write tests'
  feat-export:
    type: Feature
    layer: application
    status: draft
    priority: core
    name: Export/Import Tools
    description: Package bot into portable archive (tar.gz). Rewrite paths on import.
    tasks:
      - '[ ] Design export format (BotCorePackage)'
      - '[ ] Implement tar.gz creation'
      - '[ ] Path rewriting engine'
      - '[ ] Import validation'
      - '[ ] CLI commands (botcore export/import)'
  feat-cloud-sync:
    type: Feature
    layer: application
    status: draft
    priority: supporting
    name: Cloud Memory Sync
    description: HTTP API wrapper + sync module for cross-platform memory sharing. Push/pull/listen with conflict resolution.
    tasks:
      - '[ ] Design Memory HTTP API (recall, store, consolidate, stats)'
      - '[ ] Implement MemorySync class (push/pull/listen)'
      - '[ ] Add conflict resolution (local/remote/merge)'
      - '[ ] WebSocket for real-time sync'
      - '[ ] OpenAPI spec generation'
      - '[ ] Deploy template (Railway/Fly.io)'
      - '[ ] Write ChatGPT integration example'
  comp-memory-engram:
    type: Component
    layer: infrastructure
    status: active
    priority: core
    name: Engram Wrapper
    description: TypeScript wrapper for Engram Python MCP server. Handle subprocess, IPC.
  comp-memory-files:
    type: Component
    layer: infrastructure
    status: active
    priority: supporting
    name: File-based Memory
    description: Sync memory/YYYY-MM-DD.md files. Markdown parsing and generation.
  comp-identity-parser:
    type: Component
    layer: application
    status: active
    priority: core
    name: Identity File Parser
    description: Parse SOUL.md, IDENTITY.md, USER.md into structured data.
  comp-skill-loader:
    type: Component
    layer: application
    status: draft
    priority: supporting
    name: Skill Loader
    description: Load skills from directory, parse SKILL.md metadata.
  comp-cli:
    type: Component
    layer: interface
    status: draft
    priority: core
    name: CLI Tool
    description: 'Command-line interface: botcore init/export/import/sync.'
    tasks:
      - '[ ] CLI framework setup (yargs/commander)'
      - '[ ] init command'
      - '[ ] export command'
      - '[ ] import command'
      - '[ ] sync command (future)'
  comp-http-api:
    type: Component
    layer: interface
    status: draft
    priority: supporting
    name: Memory HTTP API Server
    description: Express/Fastify server wrapping Engram. RESTful endpoints for recall, store, consolidate.
  comp-sync-engine:
    type: Component
    layer: application
    status: draft
    priority: supporting
    name: Sync Engine
    description: Handle push/pull, incremental sync, conflict resolution, WebSocket real-time.
  comp-browser-ext:
    type: Component
    layer: interface
    status: draft
    priority: generic
    name: Browser Extension
    description: Chrome/Firefox extension for cross-platform memory bar. Inject into ChatGPT, Claude, etc.
  sdk-typescript:
    type: Interface
    layer: interface
    status: draft
    priority: core
    name: TypeScript SDK
    description: Public API for BotCore. Exported from src/index.ts.
  example-basic:
    type: Component
    layer: interface
    status: in_progress
    priority: supporting
    name: Basic Bot Example
    description: Minimal example showing Memory + Identity usage.
    tasks:
      - '[x] Create example/ folder'
      - '[x] Write memory example (examples/memory-basic.ts)'
      - '[x] Write identity example (examples/identity-basic.ts)'
      - '[x] Document usage in README'
  doc-architecture:
    type: File
    layer: interface
    status: draft
    priority: supporting
    name: Architecture Documentation
    description: docs/ARCHITECTURE.md with detailed design.
  doc-migration:
    type: File
    layer: interface
    status: draft
    priority: supporting
    name: Migration Guide
    description: docs/MIGRATION.md for moving bots between platforms.
  feat-gid-enforcement:
    type: Feature
    description: Multi-layer system to ensure bots follow GID workflow (pre-flight guards, auto-injection, hooks, memory)
    layer: application
    status: draft
    priority: core
    tasks:
      - '[ ] Implement Layer 1: Pre-flight Guard (block coding without GID check)'
      - '[ ] Implement Layer 2: Context Auto-Injection (auto-show tasks)'
      - '[ ] Implement Layer 3: Pre-Commit Hooks (block commits)'
      - '[ ] Implement Layer 4: Memory Reinforcement (Engram learns violations)'
      - '[ ] Implement Layer 5: CLI Assistant Mode (interactive confirm)'
      - '[ ] Add configuration system (GID_GUARD env var)'
      - '[ ] Test with Clawd for 1 week'
      - '[ ] Write integration guide for other bots'
      - '[ ] Collect metrics (compliance rate)'
edges:
  - from: feat-memory
    to: comp-memory-engram
    relation: depends_on
  - from: feat-memory
    to: comp-memory-files
    relation: depends_on
  - from: feat-identity
    to: comp-identity-parser
    relation: depends_on
  - from: feat-skills
    to: comp-skill-loader
    relation: depends_on
  - from: feat-export
    to: feat-memory
    relation: depends_on
  - from: feat-export
    to: feat-identity
    relation: depends_on
  - from: feat-export
    to: feat-skills
    relation: depends_on
  - from: feat-export
    to: feat-config
    relation: depends_on
  - from: comp-cli
    to: feat-export
    relation: depends_on
  - from: sdk-typescript
    to: feat-memory
    relation: depends_on
  - from: sdk-typescript
    to: feat-identity
    relation: depends_on
  - from: sdk-typescript
    to: feat-skills
    relation: depends_on
  - from: sdk-typescript
    to: feat-config
    relation: depends_on
  - from: example-basic
    to: sdk-typescript
    relation: depends_on
  - from: feat-cloud-sync
    to: feat-memory
    relation: depends_on
  - from: feat-cloud-sync
    to: comp-http-api
    relation: depends_on
  - from: feat-cloud-sync
    to: comp-sync-engine
    relation: depends_on
  - from: comp-http-api
    to: comp-memory-engram
    relation: depends_on
  - from: comp-sync-engine
    to: comp-http-api
    relation: depends_on
  - from: comp-browser-ext
    to: comp-http-api
    relation: depends_on
  - from: comp-cli
    to: feat-cloud-sync
    relation: related_to
